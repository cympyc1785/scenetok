defaults:
  - view_sampler: bounded

# MultiDataset DL3DV+RE10K, INTERPOLATION only (expansion 0 = no extrapolation).
# Each sub keeps its OWN bounded view_sampler with a PER-DATASET target
# extrapolation range (LagerNVS convention): DL3DV target gap ~[10,20] frames
# (short image sequences), RE10K ~[25,192] frames (long walkthroughs). RE10K
# scenes are much shorter in frame-COUNT so it also needs TIGHTER context
# spacing to leave room for extrapolation. Shapes/counts match so batches collate.
name: multi
weights: [0.5, 0.5]
length: 100000
fps: 24
precomputed_latents: {context: false, target: false}

# Shared temporal layout the wrapper reads (NOT used for sampling).
view_sampler:
  name: bounded
  context_sampling: farthest_point
  num_context_views: 16
  num_target_views: 10
  temporal_downsample: 4
  chunk_targets: false
  offset: 1

datasets:
  # ── DL3DV: 1K smallset, scaled focal (va-wan compat). target extrap [10,20].
  - name: dl3dv
    root: ./DATA/DL3DV/DL3DV-960
    smallset: true
    shape: [256, 256]
    context_shape: [256, 256]
    target_shape: [256, 256]
    target_latent_type: wan
    scale_context_focal_by_256: false   # KNOWN_BUGS Bug2 OFF: focal 정규화(~0.8)로 re10k와 규약 통일
    random_transform_extrinsics: false
    precomputed_latents: {context: false, target: false}
    baseline_epsilon: 1e-3
    make_baseline: false
    augment: true
    cameras_are_circular: false
    fps: 24
    stage_override: null
    scene_id: null
    do_scale_and_pad: false
    scale_focal_by_256: false
    view_sampler:
      name: bounded
      context_sampling: farthest_point
      temporal_downsample: 4
      num_context_views: 16
      num_target_views: 10
      # LagerNVS 256-native dl3dv: delta_t [10,20] x expansion 1.0 (coupled).
      lagernvs_extrap: true
      view_range_min: 10
      view_range_max: 20
      expansion_factor: 0.0     # INTERPOLATION only (target within context window)
      chunk_targets: false
      offset: 1
  # ── RE10K: .torch (native pipeline), short scenes → tight context spacing,
  #    target extrap [25,192] (LagerNVS re10k range).
  - name: re10k
    root: ./DATA/re10k/re10k
    shape: [256, 256]
    make_baseline: true
    augment: false
    random_transform_extrinsics: false
    background_color: [0.0, 0.0, 0.0]
    cameras_are_circular: false
    fps: 24
    precomputed_latents: {context: false, target: false}
    baseline_epsilon: 1e-3
    max_fov: 100.0
    view_sampler:
      name: bounded
      context_sampling: farthest_point
      temporal_downsample: 4
      num_context_views: 16
      num_target_views: 10
      # LagerNVS 256-native re10k: delta_t [25,192] x expansion 0.1 (coupled).
      # delta_t auto-clamps to fit short re10k clips; target stays contiguous (video).
      lagernvs_extrap: true
      view_range_min: 25
      view_range_max: 192
      expansion_factor: 0.0     # INTERPOLATION only (target within context window)
      chunk_targets: false
      offset: 1
