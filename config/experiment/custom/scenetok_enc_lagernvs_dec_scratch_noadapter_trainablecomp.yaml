# @package _global_
#
# (C) TRAINABLE SceneTok encoder + feed-forward LagerNVS decoder, SCRATCH, NO ADAPTER.
#   Same as (B') scratch_noadapter but the SceneTok mv_B1 compressor is UNFROZEN
#   (finetuned from va-wan_dl3dv.ckpt together with the scratch renderer). scene
#   token(64ch) is fed directly as renderer KV (no adapter, hidden_size=64).
#   Loss = L2 + 0.5·LPIPS pixel recon. No diffusion. DL3DV smallset @256×256.
#   Validation also logs OOD camera-move videos (orig|L|R|F|B), video only.
defaults:
  - override /dataset: dl3dv
  - override /dataset/view_sampler: bounded
  - override /model/scheduler: rf
  - override /model/denoiser: lagernvs_renderer
  - override /model/autoencoders/context: va
  - override /model/autoencoders/target: wan
  - override /model/compressor: mv_B1
  - override /model/compressor/camera: ray
  - override /model/compressor/camera/embedding: lvsm

dataset:
  root: ./DATA/DL3DV/DL3DV-960
  smallset: true
  target_latent_type: wan
  context_shape: [256, 256]
  target_shape: [256, 256]
  scale_context_focal_by_256: true   # match the va-wan_dl3dv compressor's training
  view_sampler:
    num_context_views: 16
    num_target_views: 8
    min_distance_between_context_views: 64
    max_distance_between_context_views: 96
    context_gap_warm_up_steps: 30_000
    target_gap_warm_up_steps: 30_000
    initial_min_distance_between_context_views: 48
    initial_max_distance_between_context_views: 64
    chunk_targets: false
    offset: 1

data_loader:
  train:
    batch_size: 4
  val:
    standard:
      shuffle: false
      batch_size: 4
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
    unseen:
      shuffle: false
      batch_size: 4
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
val:
  video_length: 34
  window_shift: 5
wandb:
  tags: [dl3dv, scenetok_enc, lagernvs_dec, feedforward, scratch, noadapter, trainablecomp]
  activated: true

sampler:
  clean_targets: 5

freeze:
  denoiser: false        # renderer trains
  compressor: false      # SceneTok compressor TRAINABLE (finetune from va-wan_dl3dv)

model:
  denoiser:
    renderer_ckpt: null        # SCRATCH: no pretrained decoder
    use_scene_adapter: false   # feed scene tokens directly as KV
    hidden_size: 64            # == scene_token_dim (no adapter)
    num_heads: 4               # 64 / 4 = head_dim 16
    val_render_moves: true     # log OOD camera-move videos in validation
    val_move_amount: 0.6
  compressor:
    ckpt_path: checkpoints/va-wan_dl3dv.ckpt
    load_strict: false
    kl_weights: [0.0, 0.0]
    input_shape: [16, 16]
    num_scene_tokens: 1024
    causal_self_atten: false
    gradient_checkpointing: false
    token_dim: 64
    init_large: true
    camera_conditioning: adaLN
    scene_token_projection: kl
    mask_context: false
    camera:
      input_shape: [128, 128]
      embedding:
        patch_size: 16
    kwargs:
      use_rope_2d: true
      use_rope_3d: false
      patch_size: 2

trainer:
  max_steps: 5_000_001
  val_check_interval: 5000
  task_steps: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1
  precision: bf16-mixed

optimizer:
  name: AdamW
  lr: 4.0e-4              # scratch renderer + compressor finetune (single lr)
  scale_lr: false
  milestones: [2000]
  scheduler:
    - name: LinearLR
      frequency: 1
      interval: step
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
    - name: MultiStepLR
      frequency: 1
      interval: step
      kwargs:
        milestones: [500000]
        gamma: 0.8
