# @package _global_
#
# lagernvs_va-wan_dl3dv_recon_sceneLRnorm_shuf (#1 scene_lr_mult + #2 output_norm
# 윈도우 밖으로 확장(max_distance_to_context_views 0→48 warmup). base(interp only)
# 대비 extrapolation 학습. LagerNVS(reconstructor frozen, output_norm만 학습) 인코더
# + SceneTok lightningdit 디코더(finetune), dense 768(768→64 없음).
# ⚠️ expanded_linear(raw-frame) sampler는 wan-latent(td=4) target과 비호환이라
# bounded + max_distance_to_context_views로 extrapolation 구현.
defaults:
  - override /dataset: dl3dv
  - override /dataset/view_sampler: bounded
  - override /model/scheduler: rf
  - override /model/denoiser: lightningdit_L_1
  - override /model/autoencoders/context: va
  - override /model/autoencoders/target: wan
  - override /model/compressor: lagernvs
  - override /model/denoiser/camera: ray
  - override /model/denoiser/camera/embedding: lvsm

dataset:
  root: ./DATA/DL3DV/DL3DV-960
  smallset: true
  target_latent_type: wan
  context_shape: [256, 256]
  target_shape: [256, 256]
  scale_context_focal_by_256: true
  view_sampler:
    num_context_views: 16
    num_target_views: 10
    min_distance_between_context_views: 64
    max_distance_between_context_views: 96
    context_gap_warm_up_steps: 30_000
    target_gap_warm_up_steps: 30_000
    initial_min_distance_between_context_views: 48
    initial_max_distance_between_context_views: 64
    # base sceneLRnorm_shuf는 둘 다 0(=interpolation only).
    # LagerNVS식: 매 샘플 g∈[10,20] 뽑아 target을 context 윈도우 밖 ±g 확장(no warmup).
    target_extrap_range: [10, 20]
    chunk_targets: false
    offset: 1
    shuffle_context: true   # #E1: permute context view order (train only)

data_loader:
  train:
    batch_size: 2
  val:
    standard:
      shuffle: false
      batch_size: 2
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
    unseen:
      shuffle: false
      batch_size: 2
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
val:
  video_length: 34
  window_shift: 5
wandb:
  tags: [dl3dv, lagernvs, stage_a, dense, sceneLR, output_norm, shuf, extrap]
  activated: true

sampler:
  clean_targets: 5

freeze:
  denoiser: false
  compressor: false       # only compressor.output_norm trains (reconstructor hard-frozen in-module)

model:
  scheduler:
    sampling_type: random_uniform
    num_inference_steps: 25
    kwargs:
      weighting: shifted
      timestep_shift: 4
  compressor:
    # general_512는 512 학습이라 256×256에서 깨짐 → DL3DV 256 native(2-6뷰) ckpt 사용.
    ckpt_path: submodules/lagernvs/checkpoints/lagernvs_dl3dv_2-6_v_256/model.pt
    token_reduction: none   # dense-direct (12432 rec_tokens)
    output_norm: true       # #2: trainable LayerNorm on rec_tokens
    token_dim: 768
  denoiser:
    ckpt_path: checkpoints/va-wan_dl3dv.ckpt
    load_strict: false
    input_shape: [16, 16]
    gradient_checkpointing: true
    num_target_split: 1
    val_render_moves: true    # SceneTok diffusion decoder OOD move 영상 로깅
    val_move_amount: 0.5
    camera:
      input_shape: [128, 128]
      embedding:
        patch_size: 8
        in_channels: 24
    kwargs:
      use_rope_3d: true
      in_channels: 48

trainer:
  max_steps: 5_000_001
  val_check_interval: 5000
  task_steps: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1
  precision: bf16-mixed

optimizer:
  name: AdamW
  lr: 1.0e-5
  scale_lr: false
  scene_lr_mult: 10.0       # #1: scene pathway at 1e-4, backbone at 1e-5
  milestones: [2000]
  scheduler:
    - name: LinearLR
      frequency: 1
      interval: step
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
    - name: MultiStepLR
      frequency: 1
      interval: step
      kwargs:
        milestones: [500000]
        gamma: 0.8
