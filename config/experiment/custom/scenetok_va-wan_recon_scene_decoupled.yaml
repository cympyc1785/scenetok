# @package _global_
#
# SceneTok recon (va-wan_dl3dv 256x448) 를 Scene-Decoupled wohuman 배경 영상에
# 돌려보는 inference/eval 용 config. shift8_dl3dv_finetuned_wide 모델부(256x448,
# LightningDiT decoder + mv_B1 compressor + va/wan autoencoder + ray camera)를
# 그대로 두고 dataset만 scene_decoupled(RECON: context=target=wohuman)로 교체.
# mode=test 시 wrapper.test_step 이 preprocess_batch(index=v_c//2)로 recon 후
# predicted/gt/context 영상을 output_dir 에 저장.
#
# ⚠️ scene_decoupled 카메라는 DL3DV convention(scale_context_focal_by_256)이 아니라
#    Unreal 24mm 정규화 intrinsic → 학습 중인 scene_decoupled controlnet 이 이 frozen
#    compressor 를 먹이는 방식과 동일(스케일 보정 없음). OOD recon 품질 확인용.

defaults:
  - override /dataset: scene_decoupled
  - override /dataset/view_sampler: bounded
  - override /model/scheduler: rf
  - override /model/denoiser: lightningdit_L_1
  - override /model/autoencoders/context: va
  - override /model/autoencoders/target: wan
  - override /model/compressor: mv_B1
  - override /model/compressor/camera: ray
  - override /model/compressor/camera/embedding: lvsm
  - override /model/denoiser/camera: ray
  - override /model/denoiser/camera/embedding: lvsm

dataset:
  root: ./DATA/Scene-Decoupled-Video-dataset
  context_shape: [256, 448]
  target_shape: [256, 448]

  # RECON: context(scene tokens)와 target(rendered)을 모두 wohuman 배경에서.
  decoupled_context: false
  target_category: wohuman

  # va-wan_dl3dv compressor 는 DL3DV KNOWN_BUG(context focal ≈×15/×8.4)로 학습됨.
  # 미적용 시 context intrinsic 이 ~18× OOD → recon PSNR 10.8dB. 적용 시 17.7dB.
  scale_context_focal_by_256: true

  view_sampler:
    num_context_views: 16
    num_target_views: 10
    min_distance_between_context_views: 8
    max_distance_between_context_views: 40
    initial_min_distance_between_context_views: 8
    initial_max_distance_between_context_views: 40
    chunk_targets: false
    offset: 1
    temporal_downsample: 4

val:
  video_length: 34
  window_shift: 5

sampler:
  clean_targets: 5

freeze:
  denoiser: true
  compressor: true

model:
  text_encoder: null

  scheduler:
    sampling_type: random_uniform
    num_inference_steps: 25
    kwargs:
      weighting: shifted
      timestep_shift: 8

  denoiser:
    ckpt_path: checkpoints/va-wan_dl3dv_256x448.ckpt
    load_strict: false
    input_shape: [16, 28]
    gradient_checkpointing: true
    num_target_split: 1
    camera:
      input_shape: [128, 224]
      embedding:
        patch_size: 8
        in_channels: 24
    kwargs:
      use_rope_3d: true
      in_channels: 48

  compressor:
    ckpt_path: checkpoints/va-wan_dl3dv_256x448.ckpt
    load_strict: false
    kl_weights: [1e-10, 1e-10]
    input_shape: [16, 28]
    num_scene_tokens: 1024
    causal_self_atten: false
    gradient_checkpointing: true
    token_dim: 64
    init_large: true
    camera_conditioning: adaLN
    scene_token_projection: kl
    mask_context: false
    camera:
      input_shape: [128, 224]
      embedding:
        patch_size: 16
    kwargs:
      use_rope_2d: true
      use_rope_3d: false
      patch_size: 2

trainer:
  precision: bf16-mixed
  limit_test_batches: 6

optimizer:
  name: AdamW
  lr: 1.0e-5
  scale_lr: false
  milestones: [2000]
  scheduler:
    - name: LinearLR
      frequency: 1
      interval: step
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
