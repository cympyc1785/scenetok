# @package _global_
# (권장) SceneTok-enc + LagerNVS-dec, EXTRAPOLATION + 권장 조합:
#  - 768 raw(reproject_out=false, adapter 없음, renderer hidden 768 직결)
#  - compressor UNFREEZE(scene_lr_mult로 낮은 lr) → extrapolation에 적응
#  - num_context 16(frozen 분포 회피 불필요하나 유지), target extrapolation(max 48)
#
# (A) frozen SceneTok encoder + feed-forward LagerNVS decoder, WARM-START.
#   context → FROZEN SceneTok MVAE compressor (va-wan_dl3dv.ckpt) → scene_tokens
#   (1024×64, KL) → trainable adapter(64→768) → LagerNVS feed-forward Renderer
#   (target Plücker rays = query, scene tokens = KV, deterministic, pixel RGB).
#   Renderer warm-started from general_512. Loss = L2 + 0.5·LPIPS. No diffusion.
#   DL3DV smallset @256×256. SceneTok compressor FROZEN; renderer + adapter train.
defaults:
  - override /dataset: dl3dv
  - override /dataset/view_sampler: bounded
  - override /model/scheduler: rf
  - override /model/denoiser: lagernvs_renderer
  - override /model/autoencoders/context: va
  - override /model/autoencoders/target: wan
  - override /model/compressor: mv_B1
  - override /model/compressor/camera: ray
  - override /model/compressor/camera/embedding: lvsm

dataset:
  root: ./DATA/DL3DV/DL3DV-960
  smallset: true
  target_latent_type: wan
  context_shape: [256, 256]
  target_shape: [256, 256]
  scale_context_focal_by_256: true   # match the frozen va-wan_dl3dv compressor's training
  view_sampler:
    num_context_views: 16
    num_target_views: 8
    min_distance_between_context_views: 64
    max_distance_between_context_views: 96
    context_gap_warm_up_steps: 30_000
    target_gap_warm_up_steps: 30_000
    initial_min_distance_between_context_views: 48
    initial_max_distance_between_context_views: 64
    # TARGET EXTRAPOLATION (학습법 ablation): target을 context 윈도우 밖 최대 48f까지(0→48 warmup).
    max_distance_to_context_views: 48
    initial_max_distance_to_context_views: 0
    chunk_targets: false
    offset: 1

data_loader:
  train:
    batch_size: 4
  val:
    standard:
      shuffle: false
      batch_size: 4
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
    unseen:
      shuffle: false
      batch_size: 4
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
val:
  video_length: 34
  window_shift: 5
wandb:
  tags: [dl3dv, scenetok_enc, lagernvs_dec, feedforward, finetune_both, no_kl_768, extrap]
  activated: true

sampler:
  clean_targets: 5

freeze:
  denoiser: false        # renderer + scene adapter train
  compressor: false      # SceneTok compressor UNFREEZE(scene_lr_mult 낮은 lr)

model:
  denoiser:
    renderer_ckpt: /data1/cympyc1785/lagernvs/checkpoints/lagernvs_general_512/model.pt
    use_scene_adapter: false   # 768 raw 토큰 직결(adapter 없음)
    hidden_size: 768
    scene_token_dim: 768
    num_heads: 12
    val_render_moves: true
    val_move_amount: 0.6
  compressor:
    ckpt_path: checkpoints/va-wan_dl3dv.ckpt
    load_strict: false
    kl_weights: [0.0, 0.0]
    reproject_out: false          # 768 raw(KL 64압축 제외)
    scene_token_projection: simple
    input_shape: [16, 16]
    num_scene_tokens: 1024
    causal_self_atten: false
    gradient_checkpointing: false
    token_dim: 64
    init_large: true
    camera_conditioning: adaLN
    mask_context: false
    camera:
      input_shape: [128, 128]
      embedding:
        patch_size: 16
    kwargs:
      use_rope_2d: true
      use_rope_3d: false
      patch_size: 2

trainer:
  max_steps: 5_000_001
  val_check_interval: 5000
  task_steps: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1
  precision: bf16-mixed

optimizer:
  name: AdamW
  lr: 1.0e-4              # renderer warm-start finetune @ 1e-4
  scale_lr: false
  scene_lr_mult: 0.1     # compressor(+scene) @ 1e-5 (pretrained finetune, NaN 회피)
  milestones: [2000]
  scheduler:
    - name: LinearLR
      frequency: 1
      interval: step
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
    - name: MultiStepLR
      frequency: 1
      interval: step
      kwargs:
        milestones: [500000]
        gamma: 0.8
