# @package _global_
# LagerNVS-enc(frozen reconstructor lagernvs_dl3dv_2-6_v_256, output_norm만 학습)
# + SceneTok LightningDiT-dec(warm-start va-wan_dl3dv.ckpt, finetune), dense 768.
# lagernvs_va-wan_dl3dv_recon_sceneLRnorm_shuf_extrap의 DL3DV+RE10K MIXED 버전.
# 각 sub가 자기 bounded view_sampler로 PER-DATASET target extrapolation:
# dl3dv [10,20], re10k [25,192] (+shuffle_context). scene_lr_mult 10 + output_norm.
defaults:
  - override /dataset: multi_dl3dv_re10k_shuf
  - override /model/scheduler: rf
  - override /model/denoiser: lightningdit_L_1
  - override /model/autoencoders/context: va
  - override /model/autoencoders/target: wan
  - override /model/compressor: lagernvs
  - override /model/denoiser/camera: ray
  - override /model/denoiser/camera/embedding: lvsm

data_loader:
  train:
    batch_size: 2
  val:
    standard:
      shuffle: false
      batch_size: 2
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
    unseen:
      shuffle: false
      batch_size: 2
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
val:
  video_length: 34
  window_shift: 5
wandb:
  tags: [mixed, dl3dv, re10k, lagernvs, stage_a, dense, sceneLR, output_norm, shuf, extrap]
  activated: true

sampler:
  clean_targets: 5

freeze:
  denoiser: false
  compressor: false       # only compressor.output_norm trains (reconstructor hard-frozen in-module)

model:
  scheduler:
    sampling_type: random_uniform
    num_inference_steps: 25
    kwargs:
      weighting: shifted
      timestep_shift: 4
  compressor:
    ckpt_path: submodules/lagernvs/checkpoints/lagernvs_dl3dv_2-6_v_256/model.pt
    token_reduction: none   # dense-direct
    output_norm: true       # trainable LayerNorm on rec_tokens
    token_dim: 768
  denoiser:
    ckpt_path: checkpoints/va-wan_dl3dv.ckpt
    load_strict: false
    input_shape: [16, 16]
    gradient_checkpointing: true
    num_target_split: 1
    val_render_moves: true
    val_move_amount: 0.5
    camera:
      input_shape: [128, 128]
      embedding:
        patch_size: 8
        in_channels: 24
    kwargs:
      use_rope_3d: true
      in_channels: 48

trainer:
  max_steps: 5_000_001
  val_check_interval: 5000
  task_steps: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1
  precision: bf16-mixed

optimizer:
  name: AdamW
  lr: 1.0e-5
  scale_lr: false
  scene_lr_mult: 10.0       # scene pathway at 1e-4, backbone at 1e-5
  milestones: [2000]
  scheduler:
    - name: LinearLR
      frequency: 1
      interval: step
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
    - name: MultiStepLR
      frequency: 1
      interval: step
      kwargs:
        milestones: [500000]
        gamma: 0.8
