# @package _global_
#
# 진단용: 학습이 실제 쓰는 frozen compressor(unscaled ckpt, scale OFF)로
# DynamicVerse 배경(inpaint_result)을 RECON 해서 scene-token 이 배경을 얼마나
# 선명히 담는지(BG 병목) 확인. context=target=inpaint_result(배경). PSNR/육안.
# 모델부는 scenetok_va-wan_recon_scene_decoupled_unscaled 와 동일(256×448→480×832,
# va-wan_dl3dv_256-480_unscaled_intrins), dataset만 dynamicverse.

defaults:
  - override /dataset: dynamicverse
  - override /dataset/view_sampler: bounded
  - override /model/scheduler: rf
  - override /model/denoiser: lightningdit_L_1
  - override /model/autoencoders/context: va
  - override /model/autoencoders/target: wan
  - override /model/compressor: mv_B1
  - override /model/compressor/camera: ray
  - override /model/compressor/camera/embedding: lvsm
  - override /model/denoiser/camera: ray
  - override /model/denoiser/camera/embedding: lvsm

dataset:
  root: ./WorldTraj/dynamicverse
  context_shape: [256, 448]
  target_shape: [480, 832]
  video_name: inpaint_result.mp4
  target_video_name: inpaint_result.mp4      # RECON: 배경↔배경
  prompt_style: window_dict
  scale_context_focal_by_256: false          # unscaled ckpt → 켜지 말 것

  view_sampler:
    num_context_views: 16
    num_target_views: 10
    min_distance_between_context_views: 8
    max_distance_between_context_views: 40
    initial_min_distance_between_context_views: 8
    initial_max_distance_between_context_views: 40
    chunk_targets: false
    offset: 1
    temporal_downsample: 4

val:
  video_length: 34
  window_shift: 5

sampler:
  clean_targets: 5

freeze:
  denoiser: true
  compressor: true

model:
  text_encoder: null
  scheduler:
    sampling_type: random_uniform
    num_inference_steps: 25
    kwargs:
      weighting: shifted
      timestep_shift: 8
  denoiser:
    ckpt_path: checkpoints/va-wan_dl3dv_256-480_unscaled_intrins.ckpt
    load_strict: false
    input_shape: [30, 52]
    gradient_checkpointing: true
    num_target_split: 1
    camera:
      input_shape: [240, 416]
      embedding:
        patch_size: 8
        in_channels: 24
    kwargs:
      use_rope_3d: true
      in_channels: 48
  compressor:
    ckpt_path: checkpoints/va-wan_dl3dv_256-480_unscaled_intrins.ckpt
    load_strict: false
    kl_weights: [1e-10, 1e-10]
    input_shape: [16, 28]
    num_scene_tokens: 1024
    causal_self_atten: false
    gradient_checkpointing: true
    token_dim: 64
    init_large: true
    camera_conditioning: adaLN
    scene_token_projection: kl
    mask_context: false
    camera:
      input_shape: [128, 224]
      embedding:
        patch_size: 16
    kwargs:
      use_rope_2d: true
      use_rope_3d: false
      patch_size: 2

trainer:
  precision: bf16-mixed
  limit_test_batches: 6

optimizer:
  name: AdamW
  lr: 1.0e-5
  scale_lr: false
  milestones: [2000]
  scheduler:
    - name: LinearLR
      frequency: 1
      interval: step
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
