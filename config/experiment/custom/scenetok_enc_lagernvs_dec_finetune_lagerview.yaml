# @package _global_
#
# (E) SceneTok encoder + LagerNVS decoder, BOTH warm-start & finetuned, with a
# LagerNVS-style view sampler (expanded_linear).
#   - encoder: mv_B1 compressor warm-start(va-wan_dl3dv.ckpt), TRAINABLE(finetune),
#     reproject_out=false → 768 raw scene token (KL 64압축 제외).
#   - decoder: LagerNVS renderer(hidden 768) warm-start(general_512), TRAINABLE,
#     adapter 없이 768 토큰 KV 직결.
#   - view sampler: expanded_linear (LagerNVS식 sparse cond + target extrapolation
#     + context shuffle; num_cond 6 고정).
#   - compressor는 pretrained라 낮은 lr(scene_lr_mult), renderer는 warm-start finetune lr.
#   Loss = L2 + 0.5·LPIPS. No diffusion. DL3DV smallset @256×256. val OOD move 영상 로깅.
defaults:
  - override /dataset: dl3dv
  - override /dataset/view_sampler: expanded_linear
  - override /model/scheduler: rf
  - override /model/denoiser: lagernvs_renderer
  - override /model/autoencoders/context: va
  - override /model/autoencoders/target: wan
  - override /model/compressor: mv_B1
  - override /model/compressor/camera: ray
  - override /model/compressor/camera/embedding: lvsm

dataset:
  root: ./DATA/DL3DV/DL3DV-960
  smallset: true
  target_latent_type: wan
  context_shape: [256, 256]
  target_shape: [256, 256]
  scale_context_focal_by_256: true   # match the frozen-init va-wan_dl3dv compressor
  view_sampler:
    num_context_views: 6
    num_target_views: 8
    view_range_min: 10
    view_range_max: 20
    expansion_factor: 1.0
    temp_jitter_prop: 0.1
    target_has_input_p: 1.0
    shuffle_context: true

data_loader:
  train:
    batch_size: 4
  val:
    standard:
      shuffle: false
      batch_size: 4
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
    unseen:
      shuffle: false
      batch_size: 4
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
val:
  video_length: 34
  window_shift: 5
wandb:
  tags: [dl3dv, scenetok_enc, lagernvs_dec, feedforward, finetune_both, no_kl_768, lagerview]
  activated: true

sampler:
  clean_targets: 5

freeze:
  denoiser: false        # renderer TRAINABLE (warm-start finetune)
  compressor: false      # SceneTok compressor TRAINABLE (warm-start finetune)

model:
  denoiser:
    renderer_ckpt: /data1/cympyc1785/lagernvs/checkpoints/lagernvs_general_512/model.pt
    use_scene_adapter: false   # 768 tokens fed directly as KV (no 64->768 adapter)
    hidden_size: 768           # == scene_token_dim (768 raw SceneTok token)
    scene_token_dim: 768
    num_heads: 12
    val_render_moves: true
    val_move_amount: 0.6
  compressor:
    ckpt_path: checkpoints/va-wan_dl3dv.ckpt
    load_strict: false
    kl_weights: [0.0, 0.0]
    input_shape: [16, 16]
    num_scene_tokens: 1024
    causal_self_atten: false
    gradient_checkpointing: false
    token_dim: 64
    reproject_out: false          # 768 raw scene token (skip out_proj 768->64 KL)
    scene_token_projection: simple
    init_large: true
    camera_conditioning: adaLN
    mask_context: false
    camera:
      input_shape: [128, 128]
      embedding:
        patch_size: 16
    kwargs:
      use_rope_2d: true
      use_rope_3d: false
      patch_size: 2

trainer:
  max_steps: 5_000_001
  val_check_interval: 5000
  task_steps: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1
  precision: bf16-mixed

optimizer:
  name: AdamW
  lr: 1.0e-4              # renderer warm-start finetune @ 1e-4
  scale_lr: false
  # compressor(+scene) 파라미터 그룹 @ lr*scene_lr_mult = 1e-5 (pretrained finetune,
  # 높은 lr이면 compressor.scene_tokens grad NaN — trainablecomp에서 확인됨).
  scene_lr_mult: 0.1
  milestones: [2000]
  scheduler:
    - name: LinearLR
      frequency: 1
      interval: step
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
    - name: MultiStepLR
      frequency: 1
      interval: step
      kwargs:
        milestones: [500000]
        gamma: 0.8
