# @package _global_
#
# sceneLRnorm_shuf_extrap의 DECODER-SCRATCH ablation.
# base(..._sceneLRnorm_shuf_extrap)와 100% 동일하나 SceneTok lightningdit 디코더를
# warm-start(va-wan_dl3dv.ckpt) → SCRATCH(ckpt_path null)로 바꾼 유일한 차이.
# decoder warm-start가 이 recon 세팅에 얼마나 기여하는지 측정용.
# 나머지: LagerNVS(reconstructor frozen, output_norm만 학습) 인코더 + dense 768,
# scene_lr_mult 10, shuffle_context, target extrapolation ±[10,20].
defaults:
  - override /dataset: dl3dv
  - override /dataset/view_sampler: bounded
  - override /model/scheduler: rf
  - override /model/denoiser: lightningdit_L_1
  - override /model/autoencoders/context: va
  - override /model/autoencoders/target: wan
  - override /model/compressor: lagernvs
  - override /model/denoiser/camera: ray
  - override /model/denoiser/camera/embedding: lvsm

dataset:
  root: ./DATA/DL3DV/DL3DV-960
  smallset: true
  target_latent_type: wan
  context_shape: [256, 256]
  target_shape: [256, 256]
  scale_context_focal_by_256: true
  view_sampler:
    num_context_views: 16
    num_target_views: 10
    # LagerNVS-COUPLED extrap: delta_t [10,20] x expansion 1.0 (context spacing =
    # delta_t*(nc-1), target margin = expansion*delta_t). target 연속(영상).
    lagernvs_extrap: true
    view_range_min: 10
    view_range_max: 20
    expansion_factor: 1.0
    chunk_targets: false
    offset: 1
    shuffle_context: true   # #E1: permute context view order (train only)

data_loader:
  train:
    batch_size: 2
  val:
    standard:
      shuffle: false
      batch_size: 2
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
    unseen:
      shuffle: false
      batch_size: 2
      max_batches: 4
      num_workers: 4
      seed: 0
      interval: 5000
      persistent_workers: false
val:
  video_length: 34
  window_shift: 5
wandb:
  tags: [dl3dv, lagernvs, stage_a, dense, sceneLR, output_norm, shuf, extrap, decscratch]
  activated: true

sampler:
  clean_targets: 5

freeze:
  denoiser: false
  compressor: false       # only compressor.output_norm trains (reconstructor hard-frozen in-module)

model:
  scheduler:
    sampling_type: random_uniform
    num_inference_steps: 25
    kwargs:
      weighting: shifted
      timestep_shift: 4
  compressor:
    # general_512는 512 학습이라 256×256에서 깨짐 → DL3DV 256 native(2-6뷰) ckpt 사용.
    ckpt_path: submodules/lagernvs/checkpoints/lagernvs_dl3dv_2-6_v_256/model.pt
    token_reduction: none   # dense-direct (12432 rec_tokens)
    output_norm: true       # #2: trainable LayerNorm on rec_tokens
    token_dim: 768
  denoiser:
    ckpt_path: null   # decoder SCRATCH (warm-start 제거) — 유일한 변경점
    load_strict: false
    input_shape: [16, 16]
    gradient_checkpointing: true
    num_target_split: 1
    val_render_moves: true    # SceneTok diffusion decoder OOD move 영상 로깅
    val_move_amount: 0.5
    camera:
      input_shape: [128, 128]
      embedding:
        patch_size: 8
        in_channels: 24
    kwargs:
      use_rope_3d: true
      in_channels: 48

trainer:
  max_steps: 5_000_001
  val_check_interval: 5000
  task_steps: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1
  precision: bf16-mixed

optimizer:
  name: AdamW
  lr: 1.0e-5
  scale_lr: false
  scene_lr_mult: 10.0       # #1: scene pathway at 1e-4, backbone at 1e-5
  milestones: [2000]
  scheduler:
    - name: LinearLR
      frequency: 1
      interval: step
      kwargs:
        start_factor: 5.e-4
        total_iters: 2000
    - name: MultiStepLR
      frequency: 1
      interval: step
      kwargs:
        milestones: [500000]
        gamma: 0.8
